
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hogwarts</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="container">
        <div class="icone">⚡</div>
        <h1>Hogwarts</h1>
        <p class="subtitulo">Entre no mundo da magia!</p>
        <div class="castelo">🏰</div>

        <form action="#" method="get">
            <div class="form-control">
                <label for="login">Usuário</label>
                <input type="text" id="login" placeholder="Digite seu login" required>
            </div>

            <div class="form-control">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="form-control">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="opcoes">
                <input type="checkbox" id="lembrar">
                <label for="lembrar">Lembrar meu login</label>
            </div>

            <div class="acesso">
                <p>Tipo de acesso:</p>
                <label><input type="radio" name="tipo" value="aluno" required> Aluno</label>
                <label><input type="radio" name="tipo" value="professor"> Professor</label>
            </div>

            <button type="submit">✨ Entrar em Hogwarts</button>
        </form>

        <a class="link" href="esqueci-senha.html">Esqueci minha senha</a>

        <p class="rodape">✦ A magia começa aqui ✦</p>
    </main>

</body>
</html>
