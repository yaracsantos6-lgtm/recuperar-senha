
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Hogwarts</title>
    <link rel="stylesheet" href="recuperar.css">
</head>
<body>

    <div class="container">
        <div class="icone">⚡</div>

        <h1>Hogwarts</h1>
        <p class="subtitulo">Escola de Magia e Bruxaria</p>

        <div class="livro">📖</div>

        <h2>Esqueceu sua senha?</h2>

        <p class="mensagem">
            Não se preocupe, jovem bruxo!
            Digite seu e-mail para recuperar sua senha.
        </p>

        <form>
            <div class="form-control">
                <label for="email">✉️ E-mail cadastrado:</label>
                <input type="email" id="email"
                    placeholder="Digite seu e-mail" required>
            </div>

            <button type="submit">✨ Recuperar minha senha</button>
        </form>

        <a href="esqueci-minha-senha.html"class="voltar">
            ← Voltar para o login
        </a>

        <div class="estrelas">✦ ✧ ✦ ✧ ✦</div>

        <footer>Hogwarts — Onde a magia acontece!</footer>
    </div>

</body>
</html>
